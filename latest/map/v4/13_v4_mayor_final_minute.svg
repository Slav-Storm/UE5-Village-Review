  <g id="axes_1">
   <g id="text_1">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #34443f" transform="translate(735.84 172.290313)">+306.0005: Witch secures Mayor after</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #34443f" transform="translate(735.84 188.240312)">genuine route timing. Exact restraint</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #34443f" transform="translate(735.84 205.255937)">is reserved.</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #34443f" transform="translate(735.84 217.105)"/>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #34443f" transform="translate(735.84 236.090312)">Subjects: lover, son, authority,</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #34443f" transform="translate(735.84 252.040313)">responsibility, village suffering,</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #34443f" transform="translate(735.84 267.990312)">helplessness, saving him until last.</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #34443f" transform="translate(735.84 280.905)"/>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #34443f" transform="translate(735.84 299.890312)">Final rage strengthens connected search</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #34443f" transform="translate(735.84 315.840312)">and pressure. It does not grant global</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #34443f" transform="translate(735.84 331.790313)">perception or speed up Blood's body.</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #34443f" transform="translate(735.84 344.705)"/>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #34443f" transform="translate(735.84 364.755937)">Within the final minute:12 Blood</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #34443f" transform="translate(735.84 380.144766)">deaths,4 Bone deaths,2 barrier deaths,</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #34443f" transform="translate(735.84 395.590312)">then Mayor.</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #34443f" transform="translate(735.84 408.505)"/>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #34443f" transform="translate(735.84 427.490312)">The extra minute and rage are not</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #34443f" transform="translate(735.84 443.440312)">isolated counterfactuals. The unique</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #34443f" transform="translate(735.84 459.390312)">effect of amplification cannot be</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #34443f" transform="translate(735.84 475.340312)">assigned to every late casualty.</text>
   </g>
  </g>
